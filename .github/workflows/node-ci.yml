name: Node CI (reusable)

on:
  workflow_call:
    inputs:
      scripts:
        description: Space-separated pnpm scripts to run in order
        type: string
        default: 'format:check lint typecheck test:coverage build'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run scripts
        run: |
          for s in ${{ inputs.scripts }}; do
            echo "::group::pnpm $s"; pnpm "$s"; echo "::endgroup::"
          done
